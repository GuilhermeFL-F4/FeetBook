<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeetBook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="menu-overlay" id="menuOverlay"></div>
    <div class="black-overlay"></div>

    <header class="navbar">
        <div class="navbar-container">
            <!-- Ícone de Menu Hambúrguer (Aparece só no mobile) -->
            <button class="hamburger-menu" id="menuToggle">☰</button>
            
            <div class="logo">FeetBook</div>
            <div class="search-bar">
                <input type="text" placeholder="Buscar..." id="desktopSearchTrigger" readonly>
            </div>
            <button class="mobile-search-icon" id="mobileSearchTrigger">🔍</button>
            <div class="search-screen" id="searchScreen">
            <div class="search-screen-header">
                <!-- Esta é a barra onde o usuário vai realmente digitar -->
                <input type="text" placeholder="Digite sua pesquisa..." id="searchInput" autocomplete="off">
                <button class="close-search" id="closeSearch">✕</button>
            </div>
                <!-- Esta tela fica vazia, pronta para receber os resultados do banco de dados -->
            <div class="search-results">
                <!-- Resultados aparecerão aqui -->
                </div>
            </div>
            <div class="user-actions">
                <button class="btn-upload">+ Post</button>
                <button class="btn-login">Entrar</button>
            </div>
        </div>
    </header>

    <div class="config-options" id="configOptions">
        <div class="config-sidebar">
            <button class="close-config" id="closeConfig">✕</button>
                    <ul>
                        <li class="config-tab active" data-target="panel-tema">Alterar Tema</li>
                        <li class="config-tab" data-target="panel-conta">Gerenciar Conta</li>
                        <li class="config-tab" data-target="panel-notificacoes">Notificações</li>
                    </ul>
        </div>
        
        <div class="config-content">
            
            <div id="panel-tema" class="config-panel active">
                <h2>Alterar Tema</h2>
                <div class="theme-options">
                     <input id="FeetChan" type="radio" name="tema" value="FeetChan" checked>
                     <label for="FeetChan">
                     <span class="title">FeetChan</span>
                     <small><span class="description">Tema escuro com destaque vermelho</span></small>
                    </label>

                    <input id="FeetFunny" type="radio" name="tema" value="FeetFunny">
                     <label for="FeetFunny">
                     <span class="title">FeetFunny</span>
                     <small><span class="description">Tema claro com destaque amarelo</span></small>
                    </label>

                </div>
            </div>

            <!-- Painel da Conta -->
            <div id="panel-conta" class="config-panel">
                <h2>Gerenciar Conta</h2>
                <p></p>
            </div>

            <!-- Painel de Notificações -->
            <div id="panel-notificacoes" class="config-panel">
                <h2>Notificações</h2>
                <p></p>
            </div>

        </div>
    </div>

    <main class="layout-container">
        
        <section class="feed">
            <!-- Modelo de Post -->
            <article class="post-card">
                <header class="post-header">
                    <img src="https://via.placeholder.com/60" alt="Avatar" class="avatar">
                    <span class="username">NomeDoUsuario</span>
                    <span class="post-time">há 2 horas</span>
                </header>
                <div class="post-content">
                    <img src="https://via.placeholder.com/1080x720" alt="Conteúdo do post" class="post-image">
                </div>
                <footer class="post-actions">
                    <button class="action-btn">👍 Curtir</button>
                    <button class="action-btn">💬 Comentar</button>
                </footer>
            </article>
        </section>

        <!-- SIDEBAR (Vira menu lateral no Mobile) -->
        <aside class="sidebar" id="mobileSidebar">
            <!-- Botão de fechar (Aparece só no mobile) -->
            <button class="close-menu" id="closeMenu">✕</button>

            <div class="sidebar-widget">
                <h3>Grupos</h3>
                <ul class="trending-list">
                    <li><img src="https://via.placeholder.com/40" alt="Avatar" class="avatar">Grupo 1</li>
                    <li><img src="https://via.placeholder.com/40" alt="Avatar" class="avatar">Grupo 2</li>
                    <li><img src="https://via.placeholder.com/40" alt="Avatar" class="avatar">Grupo 3</li>
                </ul>
            </div>
            <div class="sidebar-widget">
                <h3 id="button-config">⚙️ Configurações</h3>
            </div>
        </aside>
    </main>

    
    <script type="module" src="./script.js"></script>
</body>
</html>
