<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeetBook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="menu-overlay" id="menuOverlay"></div>
    <div class="black-overlay"></div>

    <header class="navbar">
        <div class="navbar-container">
            <button class="hamburger-menu" id="menuToggle">☰</button>
            
            <div class="logo" id="logoHome">FeetBook</div>
            <div class="search-bar">
                <input type="text" placeholder="Buscar grupos ou usuários..." id="desktopSearchTrigger" readonly>
            </div>
            <button class="mobile-search-icon" id="mobileSearchTrigger">🔍</button>

            <div class="search-screen" id="searchScreen">
                <div class="search-screen-header">
                    <input type="text" placeholder="Digite sua pesquisa..." id="searchInput" autocomplete="off">
                    <button class="close-search" id="closeSearch">✕</button>
                </div>
                <div class="search-results" id="searchResults"></div>
            </div>

            <div class="user-actions">
                <button class="btn-upload">+ Post</button>
                <button class="btn-login" id="btnAuthAction">Entrar</button>
            </div>
        </div>
    </header>

    <!-- CRIAR POST -->
    <div class="upload-modal" id="uploadModal">
        <button class="close-upload" id="closeUpload">✕</button>
        <h2>Novo Post</h2>

        <form class="upload-form" id="uploadForm">
            <label for="postImageInput" class="upload-dropzone" id="uploadDropzone">
                <span id="dropzoneText">🖼️ Clique para selecionar uma imagem</span>
                <img id="imagePreview" class="image-preview hidden" alt="Pré-visualização do post">
            </label>
            <input type="file" id="postImageInput" accept="image/*" required>

            <div class="input-group">
                <label for="postGroup">Grupo</label>
                <select id="postGroup" required>
                    <!-- Preenchido automaticamente com os grupos do Supabase -->
                </select>
            </div>

            <p class="upload-feedback" id="uploadFeedback"></p>
            <button type="submit" class="upload-submit" id="uploadSubmitBtn">Publicar</button>
        </form>
    </div>

    <!-- LOGIN / CADASTRO -->
    <div class="auth-modal" id="authModal">
        <button class="close-auth" id="closeAuth">✕</button>

        <div class="auth-tabs">
            <button type="button" class="auth-tab active" data-mode="login">Entrar</button>
            <button type="button" class="auth-tab" data-mode="register">Criar Conta</button>
        </div>

        <form class="auth-form" id="authForm">
            <h2 id="authTitle">Bem-vindo de volta</h2>

            <div class="input-group hidden" id="usernameGroup">
                <label for="authUsername">Nome de usuário</label>
                <input type="text" id="authUsername" placeholder="Ex: CharlieKirk" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="authEmail">E-mail</label>
                <input type="email" id="authEmail" placeholder="seu@email.com" required>
            </div>

            <div class="input-group">
                <label for="authPassword">Senha</label>
                <input type="password" id="authPassword" placeholder="••••••••" required minlength="6">
            </div>

            <p class="auth-feedback" id="authFeedback"></p>
            <button type="submit" class="auth-submit" id="authSubmitBtn">Entrar</button>
        </form>
    </div>

    <!-- CONFIGURAÇÕES -->
    <div class="config-options" id="configOptions">
        <div class="config-sidebar">
            <button class="close-config" id="closeConfig">✕</button>
            <ul>
                <li class="config-tab active" data-target="panel-tema">Alterar Tema</li>
                <li class="config-tab" data-target="panel-conta">Gerenciar Conta</li>
                <li class="config-tab" data-target="panel-notificacoes">Notificações</li>
            </ul>
        </div>
        
        <div class="config-content">
            <div id="panel-tema" class="config-panel active">
                <h2>Alterar Tema</h2>
                <div class="theme-options">
                    <input id="FeetChan" type="radio" name="tema" value="FeetChan" checked>
                    <label for="FeetChan">
                        <span class="title">FeetChan</span>
                        <small><span class="description">Tema escuro com destaque vermelho</span></small>
                    </label>

                    <input id="FeetFunny" type="radio" name="tema" value="FeetFunny">
                    <label for="FeetFunny">
                        <span class="title">FeetFunny</span>
                        <small><span class="description">Tema claro com destaque amarelo</span></small>
                    </label>
                </div>
            </div>

            <div id="panel-conta" class="config-panel">
                <h2>Gerenciar Conta</h2>
                <div id="accountDetails" style="margin-top: 15px; display: flex; flex-direction: column; gap: 12px;">
                    <p>Você não está conectado.</p>
                </div>
            </div>

            <div id="panel-notificacoes" class="config-panel">
                <h2>Notificações</h2>
                <p style="margin-top: 15px;">Nenhuma notificação nova.</p>
            </div>
        </div>
    </div>

    <main class="layout-container">
        <section class="feed" id="feedSection">
            <!-- Cabeçalho de Grupo -->
            <div class="group-header-card hidden" id="groupHeader">
                <div class="group-banner">
                    <img src="https://via.placeholder.com/800x200" alt="Banner do Grupo" id="groupBannerImg">
                </div>
                <div class="group-info">
                    <img src="https://via.placeholder.com/80" alt="Ícone do Grupo" class="group-icon" id="groupIconImg">
                    <div class="group-details">
                        <h2 id="groupTitle">Nome do Grupo</h2>
                        <p id="groupDescription">Descrição do grupo aparece aqui.</p>
                    </div>
                    <button type="button" class="btn-join-group" id="btnJoinGroup">Entrar no Grupo</button>
                </div>
            </div>

            <!-- Os posts carregados do Supabase serão inseridos aqui -->
            <div id="feedPosts" style="display: flex; flex-direction: column; gap: 20px;"></div>
        </section>

        <!-- SIDEBAR -->
        <aside class="sidebar" id="mobileSidebar">
            <button class="close-menu" id="closeMenu">✕</button>

            <div class="sidebar-widget">
                <h3>Grupos</h3>
                <ul class="trending-list" id="groupsList">
                    <!-- Preenchido automaticamente pelo Supabase -->
                </ul>
            </div>
            <div class="sidebar-widget">
                <h3 id="button-config">⚙️ Configurações</h3>
            </div>
        </aside>
    </main>

    <script type="module" src="./script.js"></script>
</body>
</html>
